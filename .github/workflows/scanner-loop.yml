name: crypto-scanner-loop

# Один запуск работает ~5.5 часа: проход сканера, затем 5 минут бот отвечает на команды, и снова.
# Раз в час GitHub ставит следующий запуск в очередь — он стартует, когда закончится текущий.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Europe/Moscow
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сканер + команды бота (~5.5 часа)
        run: |
          git config user.name "crypto-scanner-bot"
          git config user.email "crypto-scanner-bot@users.noreply.github.com"
          END=$(( $(date +%s) + 330*60 ))
          while [ $(date +%s) -lt $END ]; do
            python scanner.py --cycle || true
            for f in seen.json signals.json journal.csv bot_state.json; do [ -f "$f" ] && git add -f "$f"; done
            git diff --cached --quiet || git commit -q -m "scanner: обновление журнала"
            git pull -q --rebase --autostash || true
            git push -q || true
            python scanner.py --serve 300 || sleep 300
          done
