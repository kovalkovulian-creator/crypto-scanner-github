name: crypto-scanner

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub может запускать с задержкой)
  workflow_dispatch:          # кнопка ручного запуска во вкладке Actions

permissions:
  contents: write             # чтобы сохранять журнал и состояние обратно в репозиторий

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Europe/Moscow
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проход сканера
        run: python scanner.py --cycle

      - name: Сохранить журнал и состояние
        run: |
          git config user.name "crypto-scanner-bot"
          git config user.email "crypto-scanner-bot@users.noreply.github.com"
          git add -f seen.json signals.json journal.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "scanner: обновление журнала"
          git pull --rebase --autostash || true
          git push || true
